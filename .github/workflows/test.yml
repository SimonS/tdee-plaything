name: Run Tests

on:
  pull_request:
    branches: [ main, master ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      php: ${{ steps.filter.outputs.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php:
              - 'packages/bdt-customisations/**'
              - '.github/workflows/test.yml'
            js:
              - '**'
              - '!packages/bdt-customisations/**'

  test:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  php-test:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          extensions: mysqli

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: packages/bdt-customisations/vendor
          key: composer-${{ hashFiles('packages/bdt-customisations/composer.json') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: packages/bdt-customisations
        run: composer install --no-interaction --prefer-dist

      - name: Get cache week key
        id: cache-date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache WordPress test artifacts
        uses: actions/cache@v5
        with:
          path: |
            /tmp/wordpress
            /tmp/wordpress-tests-lib
          key: wp-test-suite-${{ steps.cache-date.outputs.week }}-latest
          restore-keys: wp-test-suite-

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Install WordPress test suite
        working-directory: packages/bdt-customisations
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run PHP tests
        working-directory: packages/bdt-customisations
        run: ./vendor/bin/phpunit
